name: Memory pipeline trigger

# Vercel Hobby only allows daily crons, so the sub-daily L1/L2/L2.5 pipeline is
# triggered from here (free). vercel.json keeps a daily fallback run.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/jobs/process
        env:
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          TARGET_URL: ${{ vars.PIPELINE_URL || 'https://memory-wugweb.vercel.app' }}
        run: |
          if [ -z "$JOB_SECRET" ]; then echo "JOB_SECRET repo secret is not set"; exit 1; fi
          curl --fail-with-body -sS -X POST --max-time 65 \
            -H "Authorization: Bearer $JOB_SECRET" \
            "$TARGET_URL/api/jobs/process"
