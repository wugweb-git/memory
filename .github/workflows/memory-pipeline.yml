name: Memory pipeline trigger

# Vercel Hobby only allows daily crons, so the sub-daily L1/L2/L2.5 pipeline is
# triggered from here (free). GitHub schedules are best-effort and can start
# late, which is fine: /api/jobs/process is safe to run repeatedly.
# vercel.json keeps a daily run as a fallback. Needs the JOB_SECRET repo secret
# to match the JOB_SECRET value in Vercel production.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: memory-pipeline
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/jobs/process
        env:
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          TARGET_URL: ${{ vars.PIPELINE_URL || 'https://www.vedanshusrivastava.com' }}
        run: |
          if [ -z "$JOB_SECRET" ]; then echo "JOB_SECRET repo secret is not set"; exit 1; fi
          curl --fail-with-body -sS -X POST --max-time 65 \
            -H "Authorization: Bearer $JOB_SECRET" \
            "$TARGET_URL/api/jobs/process"

  publishing:
    # Drains scheduled and queued publishes. Vercel Hobby crons are daily only,
    # so without this a scheduled post would wait up to a day.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/jobs/publishing
        env:
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          TARGET_URL: ${{ vars.PIPELINE_URL || 'https://www.vedanshusrivastava.com' }}
        run: |
          if [ -z "$JOB_SECRET" ]; then echo "JOB_SECRET repo secret is not set"; exit 1; fi
          curl --fail-with-body -sS -X POST --max-time 65 \
            -H "Authorization: Bearer $JOB_SECRET" \
            "$TARGET_URL/api/jobs/publishing"
